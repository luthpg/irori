openapi: 3.0.3
info:
  title: Irori (イロリ) v1 API Specification
  description: |
    次世代プライベート・チャットアプリ「Irori」の v1 API 仕様書。
    React Router v7 + Cloudflare Durable Objects (SQLite内蔵) によるシングルパッケージ構成、
    ゼロ知識E2EE (エンドツーエンド暗号化)、および Hibernatable WebSocket 通信を定義します。

    ### E2EEの原則
    メッセージ本文、スレッド、添付メディアURL、ワークフロー内容、プライベートメモはすべてクライアント側で暗号化されます。
    サーバーには暗号文 (`ciphertext`) と初期化ベクトル (`iv`) のみが送信・保存され、平文は一切通信ラインに乗りません。
  version: 1.0.0
servers:
  - url: http://localhost:5173
    description: ローカル開発環境 (React Router / Vite)
  - url: https://irori.chat
    description: 本番環境 (Cloudflare Workers)

paths:
  /api/users/me:
    get:
      summary: 自身のアカウント情報の取得
      description: ログイン中のユーザープロファイルおよび公開鍵情報を取得します。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/users/status:
    patch:
      summary: ステータスランプ（気配）の更新
      description: 自身のステータスランプ（「ひま」「作業中」「離席」）を更新し、通知抑制と連動させます。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - statusLamp
              properties:
                statusLamp:
                  $ref: "#/components/schemas/StatusLamp"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/users/backup-vault:
    get:
      summary: 鍵復元チャレンジ情報（PINソルト・ロックアウト状態）の取得
      description: 新端末ログイン時や鍵復元時に、PIN検証用のソルトと残り試行回数を取得します。
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupVaultChallengeResponse"
        "403":
          description: アカウントが一時ロックアウト中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockoutError"
    post:
      summary: 暗号化秘密鍵ボールトの登録・更新
      description: 6桁PINとサーバーPepperから導出した鍵で暗号化した秘密鍵を UserActor に保存します。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupVaultRequest"
      responses:
        "200":
          description: 保存成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/users/verify-pin:
    post:
      summary: 6桁PIN検証 ＆ 暗号化ボールト・Pepperトークンの取得
      description: |
        クライアントで導出した `pinAuthHash` を `UserActor` で検証します。
        5回連続失敗でアカウントを一時凍結し、オフライン総当たり攻撃を遮断します。
        検証成功時のみ `encryptedBackupUserKey` と `serverPepperToken` を返却します。
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pinAuthHash
              properties:
                pinAuthHash:
                  type: string
                  description: 6桁PIN + pinSalt から PBKDF2 導出した認証用ハッシュ (Base64)
      responses:
        "200":
          description: 検証成功・ボールト返却
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupVaultUnlockResponse"
        "403":
          description: PIN不一致またはロックアウト中
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockoutError"

  /api/spaces/{spaceId}/emojis:
    get:
      summary: スペースのカスタム絵文字一覧取得
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomEmoji"
    post:
      summary: カスタム絵文字のアップロード
      description: スペース固有のスタンプ・絵文字画像を Cloudflare R2 に保存し登録します。
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - file
              properties:
                name:
                  type: string
                  description: "ショートコード（例: hearth, tea）"
                  pattern: "^[a-zA-Z0-9_-]+$"
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomEmoji"

  /api/webhooks/{token}:
    post:
      summary: 外部システムからの Inbound Webhook 投稿 (E2EE)
      description: |
        GitHub や外部サービスからの通知を専用チャンネルへ流し込みます。
        ゼロ知識 E2EE 原則に従い、Webhook 発行時に共有されたチャンネル用暗号鍵で事前暗号化されたペイロードを受信します。
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncryptedWebhookPayload"
      responses:
        "200":
          description: 投稿成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /ws/spaces/{spaceId}:
    get:
      summary: スペース内 Hibernatable WebSocket 接続
      description: |
        スペース内のリアルタイム双方向通信（新着メッセージ、リアクション、タイピング、在室気配、空気感トグル即時反映）。
        `Upgrade: websocket` ヘッダーを付与してリクエストします。
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        "101":
          description: WebSocket Upgrade 成功

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: irori_session

  responses:
    Unauthorized:
      description: 未認証またはセッション期限切れ
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Unauthorized"

  schemas:
    StatusLamp:
      type: string
      enum: [free, busy, away]
      description: |
        - `free`: 🟢 ひま（会話歓迎）
        - `busy`: 🔴 集中・作業中（通知抑制）
        - `away`: 🟡 離席・おやすみ

    UserProfile:
      type: object
      properties:
        userId:
          type: string
        defaultName:
          type: string
        defaultAvatar:
          type: string
        statusLamp:
          $ref: "#/components/schemas/StatusLamp"
        publicKey:
          type: string
          description: ECDH P-256 公開鍵 (JWK Base64)

    BackupVaultRequest:
      type: object
      required:
        - encryptedBackupUserKey
        - pinSalt
        - pinAuthHash
      properties:
        encryptedBackupUserKey:
          type: string
          description: 6桁PIN + serverPepperToken から導出した KEK で暗号化された秘密鍵 (Base64)
        pinSalt:
          type: string
          description: KDF ソルト (Base64)
        pinAuthHash:
          type: string
          description: サーバー側での PIN 試行検証用ハッシュ (Base64)

    BackupVaultChallengeResponse:
      type: object
      properties:
        pinSalt:
          type: string
        isLocked:
          type: boolean
        remainingAttempts:
          type: integer
          example: 5

    BackupVaultUnlockResponse:
      type: object
      properties:
        encryptedBackupUserKey:
          type: string
        pinSalt:
          type: string
        serverPepperToken:
          type: string
          description: Cloudflare Workers 環境シークレット (Pepper) 由来の鍵導出トークン
        remainingAttempts:
          type: integer
          example: 5

    LockoutError:
      type: object
      properties:
        error:
          type: string
          example: "Too many failed attempts or invalid PIN."
        isLocked:
          type: boolean
        remainingAttempts:
          type: integer
          example: 0
        lockedUntil:
          type: string
          format: date-time
          nullable: true

    EncryptedWebhookPayload:
      type: object
      required:
        - ciphertext
        - iv
        - keyEpoch
      properties:
        ciphertext:
          type: string
          description: AES-GCM 256bit 暗号化通知本文 (Base64)
        iv:
          type: string
          description: 初期化ベクトル (Base64)
        keyEpoch:
          type: integer
          description: スペースマスターキー世代番号

    CustomEmoji:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: "hearth"
        imageUrl:
          type: string
          example: "https://r2.irori.chat/emojis/hearth.png"
        uploadedByMemberId:
          type: string
        createdAt:
          type: string
          format: date-time

    ChannelSettings:
      type: object
      properties:
        isReadVisible:
          type: boolean
          description: "既読表示の可視化 (デフォルト: false)"
        isTypingVisible:
          type: boolean
          description: タイピング中表示
        isThreadEnabled:
          type: boolean
          description: スレッド返信機能
        isMentionEnabled:
          type: boolean
          description: メンション通知
        isAnonymousMode:
          type: boolean
          description: 匿名モード（日替わりIDマスク）
        isEphemeral:
          type: boolean
          description: 24時間自動消去モード

    EncryptedMessagePayload:
      type: object
      required:
        - channelId
        - ciphertext
        - iv
        - keyEpoch
      properties:
        channelId:
          type: string
        parentMessageId:
          type: string
          nullable: true
          description: スレッド親メッセージID
        ciphertext:
          type: string
          description: AES-GCM 256bit 暗号化本文 (Base64)
        iv:
          type: string
          description: 初期化ベクトル (Base64)
        keyEpoch:
          type: integer
          description: スペースマスターキー世代番号
        workflowType:
          type: string
          nullable: true
          enum: [poll, schedule, todo, timer]
        workflowPayloadEncrypted:
          type: string
          nullable: true
          description: ワークフロー入力値の暗号文 (Base64)
